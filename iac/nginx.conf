worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout upstream;

    # Docker's DNS updates these addresses when an API container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream cardflow_api {
        # Share balancing and failure state between nginx worker processes.
        zone cardflow_api 64k;
        server api-1:8080 resolve max_fails=1 fail_timeout=5s;
        server api-2:8080 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://cardflow_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry transport failures on the other API. A dependency 503 is a report,
            # not evidence that the API process is down (D34).
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout invalid_header;
            proxy_next_upstream_tries 2;
        }
    }
}
