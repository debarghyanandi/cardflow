name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test the browser state
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
      - name: Run tests against real Postgres
        run: dotnet test Cardflow.slnx --configuration Release --logger "console;verbosity=normal"
      - name: Start two API instances behind nginx
        run: docker compose up --build --detach --wait
      - name: Check nginx and both API instances
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            api1=$(curl --fail --silent http://127.0.0.1:8081/health | jq -r '.instance // empty' || true)
            api2=$(curl --fail --silent http://127.0.0.1:8082/health | jq -r '.instance // empty' || true)
            if [ "$api1" = api1 ] && [ "$api2" = api2 ]; then break; fi
            sleep 1
          done
          printf 'Direct API instances: %s, %s\n' "$api1" "$api2"
          test "$api1" = api1
          test "$api2" = api2
          seen_api1=0
          seen_api2=0
          for attempt in $(seq 1 30); do
            for sample in $(seq 1 4); do
              instance=$(curl --fail --silent http://127.0.0.1:8080/health | jq -r '.instance // empty' || true)
              if [ "$instance" = api1 ]; then seen_api1=1; fi
              if [ "$instance" = api2 ]; then seen_api2=1; fi
            done
            if [ "$seen_api1" = 1 ] && [ "$seen_api2" = 1 ]; then break; fi
            sleep 1
          done
          test "$seen_api1" = 1
          test "$seen_api2" = 1
      - name: Create and read a board through nginx
        run: |
          set -euo pipefail
          cookie_file=$(mktemp)
          guest_cookie_file=$(mktemp)
          trap 'rm -f "$cookie_file" "$guest_cookie_file"' EXIT
          board=$(curl --fail-with-body --silent --show-error -c "$cookie_file" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI board","nickname":"Ada"}' http://127.0.0.1:8080/api/boards)
          token=$(printf '%s' "$board" | jq -r .token)
          board_url="http://127.0.0.1:8080/api/boards/$token"
          column=$(curl --fail-with-body --silent --show-error -b "$cookie_file" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Doing","previousColumnId":null,"nextColumnId":null}' "$board_url/columns")
          column_id=$(printf '%s' "$column" | jq -r .id)
          card=$(curl --fail-with-body --silent --show-error -b "$cookie_file" \
            -H 'Content-Type: application/json' \
            -d '{"title":"First","description":"","previousCardId":null,"nextCardId":null}' \
            "$board_url/columns/$column_id/cards")
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$board_url")" = 401
          curl --fail-with-body --silent --show-error -c "$guest_cookie_file" \
            -H 'Content-Type: application/json' -d '{"nickname":"Lin"}' "$board_url/join" >/dev/null
          snapshot=$(curl --fail-with-body --silent --show-error -b "$guest_cookie_file" "$board_url")
          test "$(printf '%s' "$snapshot" | jq -r '.columns[0].cards[0].title')" = First
          test "$(printf '%s' "$card" | jq -r .title)" = First
          test "$(printf '%s' "$snapshot" | jq -r '.members | length')" = 2
      - name: Prove an event crosses API instances
        run: dotnet test tests/Cardflow.MultiInstance.Tests/Cardflow.MultiInstance.Tests.csproj --configuration Release --logger "console;verbosity=normal"
      - name: Prove 20 clients converge after 200 operations
        working-directory: web
        run: npm run test:convergence
      - name: Install browser for the drag and reconnect test
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test browser rollback and reconnect
        working-directory: web
        run: npm run test:e2e
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
