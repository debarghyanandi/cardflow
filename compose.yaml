name: cardflow

x-api: &api
  image: cardflow-api:local
  build:
    context: .
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "http://localhost:8080/health/live"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  HttpsRedirection__Enabled: "false"
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=cardflow;Username=cardflow;Password=cardflow"
  ConnectionStrings__Redis: "redis:6379"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cardflow
      POSTGRES_PASSWORD: cardflow
      POSTGRES_DB: cardflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cardflow", "-d", "cardflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api-1:
    <<: *api
    environment:
      <<: *api-environment
      InstanceName: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-environment
      InstanceName: api-2

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./iac/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "2", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
