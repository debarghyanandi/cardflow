services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cardflow
      POSTGRES_USER: cardflow
      POSTGRES_PASSWORD: ${CARDFLOW_POSTGRES_PASSWORD:-cardflow_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardflow -d cardflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1:
    build:
      context: .
      dockerfile: src/Cardflow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CARDFLOW_INSTANCE: api1
      ConnectionStrings__Postgres: Host=postgres;Database=cardflow;Username=cardflow;Password=${CARDFLOW_POSTGRES_PASSWORD:-cardflow_local_only}
      ConnectionStrings__Redis: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: src/Cardflow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CARDFLOW_INSTANCE: api2
      ConnectionStrings__Postgres: Host=postgres;Database=cardflow;Username=cardflow;Password=${CARDFLOW_POSTGRES_PASSWORD:-cardflow_local_only}
      ConnectionStrings__Redis: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  postgres_data:
